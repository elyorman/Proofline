[project]
name = "proofline"
version = "0.1.0"
description = "Match intelligence that shows its evidence, knows its limits, and corrects itself."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "azure-cosmos>=4.9",
    "azure-eventhub>=5.13",
    "azure-identity>=1.19",
    "mcp>=2.3,<3",
    "pydantic>=2.9",
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[project.scripts]
proofline-engine = "engine.cli:main"
proofline = "orchestration.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "contracts", "engine", "state", "detector", "tools_server", "ledger", "orchestration", "eval"
]
exclude = ["engine/suites"]  # sealed answers never ship in a package

[tool.hatch.build.targets.sdist]
exclude = ["engine/suites"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
