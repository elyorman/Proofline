# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

# The live API ships as a container (surfaces/api); the web app is a static replay deployed
# with `make deploy-web`.
name: proofline
infra:
  provider: bicep
  path: infra
services:
  api:
    project: .
    host: containerapp
    language: docker
    docker:
      path: surfaces/api/Dockerfile
      context: .
