name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Engine isolation guard
        run: uv run python scripts/check_engine_isolation.py
      - name: Tests
        run: uv run pytest
      - name: Schemas are up to date
        run: |
          uv run python scripts/export_schemas.py
          test -z "$(git status --porcelain -- docs/*.schema.json)" || { git status --porcelain -- docs/*.schema.json; exit 1; }
      - name: The scoreboard and the README's figures match the evaluation records
        run: |
          uv run python -m eval scoreboard --records eval/records --check docs/scoreboard.md > /dev/null
          uv run python -m eval scoreboard --records eval/records --check README.md > /dev/null

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: surfaces/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Types match the exported schemas
        run: |
          pnpm types
          test -z "$(git status --porcelain -- src/types)" || { git status --porcelain -- src/types; exit 1; }
      - name: Tests
        run: pnpm test
      - name: Type check and build
        run: pnpm build
